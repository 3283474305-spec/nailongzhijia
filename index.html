<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="images/favicon-32.png" sizes="32x32">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | My Website</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="theme-color" content="#faf7f2">
    <script>
      // 必须内联在 head 末尾、且不加 defer：
      // 在任何像素绘制前就决定主题，才能彻底避免暗色用户看到白屏闪烁
            (function () {
        // 读取失败（Safari 无痕模式会抛异常）时按「没有存储」处理，
        // 而不是直接落到日间，这样仍能跟随系统主题，也不会漏设 theme-color
        var saved = null;
        try {
          saved = localStorage.getItem('theme');
        } catch (e) { /* 忽略：当作没有存储 */ }

        var prefersDark = false;
        try {
          prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) { /* 老浏览器不支持 matchMedia */ }

        var theme = saved ? saved : (prefersDark ? 'dark' : 'light');
        if (theme !== 'dark' && theme !== 'light') theme = 'light';

        document.documentElement.dataset.theme = theme;

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#14161a' : '#faf7f2');
      })();
    </script></head>
<body>
    <header id="site-header"></header>

    <!-- Hero 横幅区域 -->
    <section class="hero">
        <h1>Welcome to My Website</h1>
        <p>This site is built entirely by hand with HTML, CSS and a little JavaScript — no frameworks, no builders.</p>
        <img src="images/035-奶龙抽象表情包.gif" alt="nailong meme">
    </section>

    <main>
        <h2>About this site</h2>
        <p>Here you will find quotes, my project ideas, a simple game and a little bit about me. Use the navigation above to explore.</p>
        <img src="images/奶蛙-迎着阳光盛大逃亡.jpg" alt="奶蛙版古典名画：迎着阳光盛大逃亡">
    </main>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>
<script src="nav.js"></script>
</body>
</html>
