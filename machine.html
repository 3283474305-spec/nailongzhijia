<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="images/favicon-32.png" sizes="32x32">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine | My Website</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="theme-color" content="#faf7f2">
    <script>
      // 必须内联在 head 末尾、且不加 defer：
      // 在任何像素绘制前就决定主题，才能彻底避免暗色用户看到白屏闪烁
            (function () {
        // 读取失败（Safari 无痕模式会抛异常）时按「没有存储」处理，
        // 而不是直接落到日间，这样仍能跟随系统主题，也不会漏设 theme-color
        var saved = null;
        try {
          saved = localStorage.getItem('theme');
        } catch (e) { /* 忽略：当作没有存储 */ }

        var prefersDark = false;
        try {
          prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) { /* 老浏览器不支持 matchMedia */ }

        var theme = saved ? saved : (prefersDark ? 'dark' : 'light');
        if (theme !== 'dark' && theme !== 'light') theme = 'light';

        document.documentElement.dataset.theme = theme;

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#14161a' : '#faf7f2');
      })();
    </script></head>
<body>
    <header id="site-header"></header>

    <header>
        <h1>Machine: Guess the Number Game</h1>
    </header>

    <main>
        <h2>Game Rules</h2>
        <p>I will pick a secret number between 1 and 20. Try to guess it!</p>

        <div class="game-box">
            <input type="number" id="guessInput" min="1" max="20" placeholder="Enter number">
            <button id="guessBtn">Submit Guess</button>
            <p id="message"></p>
            <p>Attempts: <span id="tryCount">0</span></p>
            <button id="resetBtn">Restart Game</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>

    <script src="nav.js"></script>
    <script>
        // 游戏变量
        let secretNumber = Math.floor(Math.random() * 20) + 1;
        let attempts = 0;

        const input = document.getElementById('guessInput');
        const guessBtn = document.getElementById('guessBtn');
        const resetBtn = document.getElementById('resetBtn');
        const msg = document.getElementById('message');
        const tryText = document.getElementById('tryCount');

        // 用 CSS 变量设置提示颜色：切换夜间模式时会自动跟着变色，
        // 而写死的 "red" / "green" 在暗色下会发暗、看不清
        function setMsg(text, kind) {
            msg.textContent = text;
            msg.style.color = kind ? 'var(--' + kind + ')' : '';
        }

        guessBtn.addEventListener('click', function(){
            const userGuess = Number(input.value);
            if(!userGuess || userGuess <1 || userGuess>20){
                setMsg("Please enter a number between 1 and 20!", "danger");
                return;
            }
            attempts++;
            tryText.textContent = attempts;

            if(userGuess > secretNumber){
                setMsg("Too high! Try smaller.", "accent");
            }else if(userGuess < secretNumber){
                setMsg("Too low! Try bigger.", "accent");
            }else{
                setMsg("🎉 Correct! You win!", "success");
            }
        });

        resetBtn.addEventListener('click', function(){
            secretNumber = Math.floor(Math.random() * 20) + 1;
            attempts = 0;
            tryText.textContent = 0;
            msg.textContent = "";
            input.value = "";
        });
    </script>
</body>
</html>
